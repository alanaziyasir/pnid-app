name: Feature request
description: Propose a concrete improvement with acceptance criteria
labels: ["type: feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and users affected
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Proposed behavior and acceptance criteria
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Scope, risks, and alternatives
