name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m venv backend/venv
      - run: backend/venv/bin/python -m pip install --require-hashes -r requirements-dev.txt
      - run: npm --prefix frontend ci
      - run: make check
      - run: backend/venv/bin/python -m pre_commit run --all-files --show-diff-on-failure

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m venv backend/venv
      - run: backend/venv/bin/python -m pip install --require-hashes -r requirements-dev.txt
      - run: npm --prefix frontend ci
      - run: make -j2 test
      - run: make test-stability
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-timing-and-coverage
          path: |
            reports/
            frontend/test-results/
            frontend/coverage/
          retention-days: 14

  build-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-deploy.txt
      - run: python -m venv backend/venv
      - run: backend/venv/bin/python -m pip install --require-hashes -r backend/requirements-deploy.txt
      - run: npm --prefix frontend ci
      - uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/app/**', 'frontend/lib/**') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-
      - run: ANALYZE=true make build
      - run: cd frontend && npx playwright install --with-deps chromium
      - run: make e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-metrics-bundles-and-browser-security-tests
          path: |
            reports/
            frontend/.next/analyze/
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 14

  monitoring-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: make monitoring-check

  workflow-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: docker run --rm -v "${{ github.workspace }}:/repo:ro" -w /repo rhysd/actionlint:1.7.7 -color
