name: Sync issue labels
on:
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const labels = JSON.parse(fs.readFileSync('.github/labels.json', 'utf8'));
            for (const label of labels) {
              const params = { ...context.repo, ...label };
              try {
                await github.rest.issues.getLabel({ ...context.repo, name: label.name });
                await github.rest.issues.updateLabel(params);
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel(params);
              }
            }
