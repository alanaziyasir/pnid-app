groups:
  - name: pnid
    rules:
      - alert: ApplicationHealthFailed
        expr: probe_success{job="application-health"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Application health probe failed
          runbook: docs/runbooks/operations.md
      - alert: APIErrorRateHigh
        expr: sum(rate(pnid_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(pnid_http_requests_total[5m])), 0.01) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: More than 5% of API requests fail
          runbook: docs/runbooks/operations.md
      - alert: APILatencyHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(pnid_http_request_duration_seconds_bucket[5m]))) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: API p95 latency exceeds two seconds
          runbook: docs/runbooks/operations.md
